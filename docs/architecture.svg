<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13">
  <style>
    .box{fill:#f6f8fa;stroke:#24292f;stroke-width:1.4;rx:6;ry:6}
    .api{fill:#dbeafe;stroke:#1d4ed8}
    .src{fill:#fef3c7;stroke:#b45309}
    .infra{fill:#dcfce7;stroke:#15803d}
    .lbl{fill:#24292f}
    .arrow{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .title{font-weight:600;font-size:14px}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <text x="460" y="26" text-anchor="middle" class="title">RentScout — request flow</text>

  <rect class="box api" x="20"  y="60" width="140" height="60"/>
  <text x="90"  y="86" text-anchor="middle" class="lbl">Client</text>
  <text x="90"  y="104" text-anchor="middle" class="lbl" font-size="11">HTTP / Telegram bot</text>

  <rect class="box api" x="200" y="60" width="160" height="60"/>
  <text x="280" y="86" text-anchor="middle" class="lbl">FastAPI</text>
  <text x="280" y="104" text-anchor="middle" class="lbl" font-size="11">/v1/search · /v1/listing</text>

  <rect class="box" x="400" y="60" width="160" height="60"/>
  <text x="480" y="86" text-anchor="middle" class="lbl">Search service</text>
  <text x="480" y="104" text-anchor="middle" class="lbl" font-size="11">plan · fan-out · merge</text>

  <rect class="box infra" x="600" y="60" width="140" height="60"/>
  <text x="670" y="86" text-anchor="middle" class="lbl">Cache</text>
  <text x="670" y="104" text-anchor="middle" class="lbl" font-size="11">Redis (query fp)</text>

  <rect class="box infra" x="770" y="60" width="130" height="60"/>
  <text x="835" y="86" text-anchor="middle" class="lbl">Filter</text>
  <text x="835" y="104" text-anchor="middle" class="lbl" font-size="11">normalize · dedupe</text>

  <path class="arrow" d="M160,90 L200,90"/>
  <path class="arrow" d="M360,90 L400,90"/>
  <path class="arrow" d="M560,90 L600,90"/>
  <path class="arrow" d="M740,90 L770,90"/>

  <rect class="box src" x="40"  y="180" width="110" height="48"/><text x="95"  y="210" text-anchor="middle" class="lbl">Avito</text>
  <rect class="box src" x="160" y="180" width="110" height="48"/><text x="215" y="210" text-anchor="middle" class="lbl">Cian</text>
  <rect class="box src" x="280" y="180" width="120" height="48"/><text x="340" y="210" text-anchor="middle" class="lbl">Yandex Travel</text>
  <rect class="box src" x="410" y="180" width="110" height="48"/><text x="465" y="210" text-anchor="middle" class="lbl">Sutochno</text>
  <rect class="box src" x="530" y="180" width="110" height="48"/><text x="585" y="210" text-anchor="middle" class="lbl">Ostrovok</text>
  <rect class="box src" x="650" y="180" width="110" height="48"/><text x="705" y="210" text-anchor="middle" class="lbl">Otello</text>
  <rect class="box src" x="770" y="180" width="110" height="48"/><text x="825" y="210" text-anchor="middle" class="lbl">Tvil</text>

  <path class="arrow" d="M480,120 L480,170"/>
  <text x="500" y="150" class="lbl" font-size="11">parallel parsers</text>

  <rect class="box infra" x="200" y="290" width="200" height="60"/>
  <text x="300" y="316" text-anchor="middle" class="lbl">PostgreSQL</text>
  <text x="300" y="334" text-anchor="middle" class="lbl" font-size="11">SQLAlchemy + Alembic</text>

  <rect class="box infra" x="430" y="290" width="200" height="60"/>
  <text x="530" y="316" text-anchor="middle" class="lbl">Listings · runs · audit</text>

  <path class="arrow" d="M480,120 L300,290"/>
  <path class="arrow" d="M835,120 L530,290"/>

  <text x="460" y="385" text-anchor="middle" class="lbl" font-size="11">one schema across seven sources · cache absorbs repeats · proprietary parser internals</text>
</svg>
